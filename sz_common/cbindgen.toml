language = "C"
header = """/* Senzing Encryption Plugin Interface
 *
 * AUTO-GENERATED by cbindgen from sz_common Rust crate — DO NOT EDIT.
 * Any change to the Rust FFI surface regenerates this file.
 * G2 engine keeps an exact copy; a build-time hash check catches drift.
 */"""
include_guard = "SZ_ENCRYPT_PLUGIN_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true

[struct]
rename_fields = "CamelCase"

[export]
include = [
    "CParameterTuple",
    "CParameterList",
    "G2EncryptionPluginInitPluginFuncPtr",
    "G2EncryptionPluginClosePluginFuncPtr",
    "G2EncryptionPluginGetSignatureFuncPtr",
    "G2EncryptionPluginValidateSignatureCompatibilityFuncPtr",
    "G2EncryptionPluginEncryptDataFieldFuncPtr",
    "G2EncryptionPluginDecryptDataFieldFuncPtr",
    "G2EncryptionPluginEncryptDataFieldDeterministicFuncPtr",
    "G2EncryptionPluginDecryptDataFieldDeterministicFuncPtr",
    "G2_ENCRYPTION_PLUGIN___SUCCESS",
    "G2_ENCRYPTION_PLUGIN___SIMPLE_ERROR",
    "G2_ENCRYPTION_PLUGIN___OUTPUT_BUFFER_SIZE_ERROR",
    "G2_ENCRYPTION_PLUGIN___CRITICAL_ERROR",
    "G2_ENCRYPTION_PLUGIN___FAILED_SIGNATURE_VALIDATION",
]
