name: Cargo vet

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  cargo-vet:
    name: Cargo vet
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      # Prebuilt binary (fast). Audits the supply chain against supply-chain/.
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2.81.11
        with:
          tool: cargo-vet

      - name: Run cargo-vet
        run: cargo vet --locked
