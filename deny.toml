# cargo-deny configuration — enforced by the cargo-deny.yaml workflow.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on yanked crates; RUSTSEC advisories fail by default.
yanked = "deny"

[licenses]
version = 2
# Senzing third-party dependency policy: permissive licenses only.
# NO GPL / LGPL / AGPL or any source-disclosure license in shipped binaries.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Surface accidental duplicate dependency versions without failing the build.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are path dependencies (e.g. `sz_common = { workspace
# = true }`), which carry no version req and would otherwise trip the wildcard
# check. Allow wildcards only for those first-party path deps.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
